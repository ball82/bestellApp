<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--CSS-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/menu.css" />
    <link rel="stylesheet" href="./styles/basket.css" />
    <link rel="stylesheet" href="./styles/standart.css" />
    <!--JS-->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="./js/db.js"></script>
    <script src="./js/templates.js"></script>
    <script src="./js/script.js"></script>
    <link rel="icon" href="/img/Favicon/favicon.ico" sizes="48x48" />
    <title>ItaFood</title>
  </head>
  <body onload="init()">
    <header>
      <nav class="navbar">
        <div class="container">
          <a class="navbar-brand" href="#">
            <img
              class="navbar-img"
              src="./img/Logo/Logo.png"
              alt="Bootstrap"
              height="55"
            />
          </a>
        </div>
      </nav>
    </header>

    <div class="content-wrapper">
      <section class="menu">
        <div class="menu-nav">
          <a class="nav-li" href="#pizza">Pizza</a>
          <a class="nav-li" href="#pasta">Pasta</a>
          <a class="nav-li" href="#dessert">Dessert</a>
          <a class="nav-li" href="#drink">Drink</a>
        </div>
        <div class="itaFood-logo">
          <img class="header-logo" src="./img/Logo/itaFoodLogo$.png" alt="" />
        </div>
        <img class="hero-img" src="./img/image/pizza.jpg" alt="" />
        <h2 id="pizza">Pizza</h2>
        <div id="pizzaCards"></div>

        <img class="hero-img" src="./img/image/pasta-663096_1280.jpg" alt="" />
        <h2 id="pasta">Pasta</h2>
        <div id="pastaCards"></div>

        <img class="hero-img" src="./img/image/dessert.jpg" alt="" />
        <h2 id="dessert">Desserts</h2>
        <div id="dessertCards"></div>

        <img class="hero-img" src="./img/image/drinks.jpg" alt="" />
        <h2 id="drink">Drinks</h2>
        <div id="drinkCards"></div>
      </section>

      <section class="basket-wrapper">
        <div class="basket">
          <span id="basketCount">Warenkorb</span>
          <img
            src="./img/icons/shopping-basket.png"
            alt=""
            style="width: 4rem"
          />
          <div id="basketList">
            <div id="orderList">
              <div class="orderContent" id="orderContent"></div>
            </div>
          </div>
          <div id="basketSummary"></div>
        </div>
      </section>
    </div>

    <div class="container-btn">
      <button
        id="basketButton"
        type="button"
        class="basket-btn"
        onclick="openBasketModal()"
        data-bs-toggle="modal"
        data-bs-target="#staticBackdrop"
      >
        <span>
          <img
            class="mobile-cart"
            src="./img/icons/einkaufswagen.png"
            alt=""
          />
        </span>
      </button>
    </div>

    <div
      class="modal fade"
      id="staticBackdrop"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="staticBackdropLabel"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="staticBackdropLabel">Warenkorb</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              onclick="resetNotification()"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <img
              src="./img/icons/shopping-basket.png"
              alt=""
              style="width: 4rem"
            />

            <div id="smBasketList">
              <div id="smOrderList">
                <div class="sm-orderContent" id="smOrderContent"></div>
              </div>
            </div>
            <div id="smBasketSummary"></div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="footer">
        <div class="footer-content">
          <p>© 2023 Pizza Pasta. Alle Rechte vorbehalten.</p>
          <p>Impressum | Datenschutz</p>
        </div>
      </div>
    </footer>
  </body>
</html>
